[project]
name = "paa-analyzer"
version = "0.0.1"
description = "Prisma Access Agent troubleshooting bundle analyzer — backend + web UI"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
]

[project.scripts]
paa-parse = "paa_analyzer.cli:main"
paa-server = "backend.main:run"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6", "httpx>=0.27"]
typecheck = ["mypy>=1.11", { include-group = "test" }]
lint = ["ruff>=0.16.1", "codespell>=2.3"]
audit = ["pip-audit>=2.7"]
docs = ["mkdocs-material>=9.7.7"]
dev = [
    "nox>=2024.4",
    "pre-commit>=4.6.1",
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "lint" },
    { include-group = "audit" },
    { include-group = "docs" },
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
# Repo root on sys.path so tests can `from tools import context_docs`.
pythonpath = ["."]
markers = [
    "unit: Pure function tests, no I/O",
    "integration: Tests that use ZIP parsing or SQLite",
    "api: Tests that use the FastAPI TestClient",
    "e2e: End-to-end tests using real example data",
    "slow: Tests that take more than 1 second",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]

[tool.coverage.run]
source = ["paa_analyzer", "backend"]
omit = ["backend/tests/*", "backend/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","SIM","S","ASYNC","PTH","RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts/passwords are expected; E501 for verbatim sample command output
# whose fixed column widths must be preserved; S104 for "0.0.0.0" that appears as
# routing-table sample data, not a real socket bind; RUF012 for class-level sample
# fixtures (annotating with ClassVar is deferred to the typing task).
"backend/tests/**" = ["S101", "S105", "S106", "S107", "E501", "S104", "RUF012"]
# Top-level tests/ (tooling tests, e.g. the context-docs generator): asserts only.
"tests/**" = ["S101"]
# store.py builds SQL with f-strings, but every user value is passed as a bound
# `?` parameter; only fixed, code-defined fragments (column names, whitelisted
# ASC/DESC) are interpolated, so S608 is a false positive here.
"backend/store.py" = ["S608"]
# parsers_win.py parses XML exported from a locally uploaded troubleshooting
# bundle (trusted operator input); S314 (untrusted-XML) does not apply and no
# extra dependency is introduced in this lint-only pass.
"paa_analyzer/parsers_win.py" = ["S314"]
# The Stop-hook gate subprocesses a fixed, code-defined command from
# harness.toml (never user input), so S603/S607 do not apply.
".claude/hooks/*.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["paa_analyzer", "backend"]

[tool.ruff.format]
docstring-code-format = true

[tool.codespell]
# Spell-check the Python backend only. The frontend is out of scope and trips on
# camelCase test-framework identifiers; build/vendor dirs are skipped too.
skip = "*.lock,./frontend,./.git,./.nox,./htmlcov,*/__pycache__,*/dist,*/node_modules,./site,./docs/plans"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["paa_analyzer", "backend"]

# Tests are still type-checked for real errors, but not forced to annotate every
# fixture/helper: the value of full signature annotations on test functions is low
# and would add ~530 no-untyped-def/-call lines of noise. Source stays fully strict.
[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paa_analyzer", "backend"]
