site_name: PAA Analyzer
site_description: Diagnostic tool for analyzing Prisma Access Agent troubleshooting bundles.
site_url: https://kaisero.github.io/paa-analyzer/
repo_url: https://github.com/kaisero/paa-analyzer
repo_name: kaisero/paa-analyzer
copyright: Copyright &copy; 2026 Oliver Kaiser

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Changelog: changelog.md

# Internal working files kept in the repo but excluded from the published site
# (and from --strict's pages-not-in-nav check): planning docs and deferred notes.
exclude_docs: |
  plans/
  IDEAS.md
  REVISIT.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      # Render ```mermaid blocks as diagrams (mkdocs-material has built-in
      # mermaid support; this custom fence hands them to the mermaid renderer).
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true
